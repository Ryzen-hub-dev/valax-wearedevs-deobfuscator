services:
  valax-discord-bot:
    image: ghcr.io/ryzen-hub-dev/valax-discord-bot:latest
    restart: unless-stopped
    env_file:
      - ../../.env.bot.local
    environment:
      LOCAL_RECOVERY_ENABLED: "false"
      COMMUNITY_DASHBOARD_ENABLED: "true"
      COMMUNITY_DASHBOARD_HOST: "0.0.0.0"
      COMMUNITY_DASHBOARD_PORT: "3080"
      COMMUNITY_DATA_PATH: "/app/apps/discord-bot/data/community.json"
    ports:
      - "3080:3080"
    volumes:
      - ../../apps/discord-bot/data:/app/apps/discord-bot/data
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "-", "http://127.0.0.1:3080/api/status"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
