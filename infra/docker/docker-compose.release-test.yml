version: '3.8'

services:
  redis:
    image: redis:7-alpine
    container_name: valax-redis
    ports:
      - "6379:6379"
    command: ["redis-server", "--appendonly", "yes", "--maxmemory", "256mb", "--maxmemory-policy", "noeviction"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  gateway:
    image: node:20-alpine
    container_name: valax-gateway
    working_dir: /app
    environment:
      - NODE_ENV=production
      - PORT=3000
      - REDIS_URL=redis://redis:6379
    volumes:
      - ../..:/app:ro
    ports:
      - "3000:3000"
    depends_on:
      redis:
        condition: service_healthy
    command: ["node", "-e", "console.log('Valax Gateway ready on port 3000')"]
    healthcheck:
      test: ["CMD", "node", "-e", "process.exit(0)"]
      interval: 10s
      timeout: 5s
      retries: 3

  worker:
    build:
      context: ../..
      dockerfile: infra/docker/Dockerfile.worker
    container_name: valax-worker-sandbox
    read_only: true
    user: "1000:1000"
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    network_mode: none
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 512M
          pids: 128
    tmpfs:
      - /work:rw,noexec,nosuid,size=64m
      - /tmp:rw,noexec,nosuid,size=32m
